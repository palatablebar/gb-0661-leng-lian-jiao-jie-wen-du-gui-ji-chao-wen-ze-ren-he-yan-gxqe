{% extends 'base.html' %}{% block body %}<div class="grid split"><section class="panel"><div class="panel-head"><h2>隔离证据</h2><a class="btn" href="/api/quarantine/export">导出 CSV</a></div><div class="panel-body"><input id="filter" placeholder="筛选原因码" aria-label="筛选原因码"></div><div class="panel-body scroll"><table id="evidence-table"><thead><tr><th>行号</th><th>原因码</th><th>失败原因</th><th>原始证据</th></tr></thead><tbody>{% for r in bundle.quarantine.rows %}<tr><td class="num">{{r.line}}</td><td>{{r.code}}</td><td>{{r.reason}}</td><td class="truncate" title="{{r.raw}}">{{r.raw}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>原因分布</h2><span>{{bundle.quarantine.total}} 条</span></div><div class="panel-body">{% for code,n in bundle.quarantine.counts.items() %}<div class="reason-row"><span>{{code}}</span><b>{{n}}</b></div>{% endfor %}</div></section></div>{% endblock %}
